# Local dev stack. Config is literal here; secrets are Docker secret files (#65).
# Nothing reads .env through env_file any more: each service gets exactly the
# environment and secrets it needs. Ports can be overridden from an optional
# .env (see .env.example), which compose reads for ${...} interpolation only.

x-db-config: &db-config
  DB_HOST: vinyl.db
  DB_PORT_INT: "5432"
  DB_VINYLTRACK_NAME: vinyltrack
  DB_VINYLTRACK_USER: vinyltrack
  DB_PASSWORD_FILE: /run/secrets/db_password

x-be-env: &be-env
  <<: *db-config
  APP_ENV: development
  NODE_ENV: development
  # Dev-only identity fallback (#26); config.ts refuses it in production.
  AUTH_BOOTSTRAP_OWNER_EMAIL: kevin@example.com

services:

  be:
    image: vinylbe
    build:
      dockerfile: Dockerfile.be
    environment:
      <<: *be-env
      PORT: "3000"
    secrets: [db_password]
    volumes:
      - ./be:/app/
      - /app/node_modules
    networks:
      - default
      - vinylnet
    ports:
      - ${BE_PORT_EXT:-5202}:3000
    container_name: vinyl.be
    command: npm run dev
    depends_on:
      seed:
        condition: service_completed_successfully

  migrate:
    image: vinylbe
    build:
      dockerfile: Dockerfile.be
    environment: *be-env
    secrets: [db_password]
    volumes:
      - ./be:/app/
      - /app/node_modules
    networks:
      - default
      - vinylnet
    container_name: vinyl.migrate
    command: npx prisma migrate deploy
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  seed:
    image: vinylbe
    build:
      dockerfile: Dockerfile.be
    environment: *be-env
    secrets: [db_password]
    volumes:
      - ./be:/app/
      - /app/node_modules
    networks:
      - default
      - vinylnet
    container_name: vinyl.seed
    command: npx prisma db seed
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully

  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_DB: vinyltrack
      POSTGRES_USER: vinyltrack
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      PGPORT: "5432"
    secrets: [db_password]
    command: -p 5432
    ports:
      - "${DB_PORT_EXT:-5204}:5432"
    container_name: vinyl.db
    volumes:
      - vinyldb_vol:/var/lib/postgresql/data
    networks:
      - default
      - vinylnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vinyltrack -d vinyltrack -p 5432"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  fe:
    image: vinylfe
    build:
      dockerfile: Dockerfile.fe
    environment:
      APP_ENV: development
      NODE_ENV: development
      PORT: "4000"
      BE_URL: http://vinyl.be
      BE_PORT_INT: "3000"
      AUTH_BOOTSTRAP_OWNER_EMAIL: kevin@example.com
    # No secrets: the FE never sees the DB password.
    volumes:
      - ./fe/public:/app/public
      - ./fe/src:/app/src
      - ./docs:/app/docs
      # Mount build configs so edits (e.g. tailwind `content`) are live without an image rebuild.
      - ./fe/tailwind.config.ts:/app/tailwind.config.ts
      - ./fe/postcss.config.mjs:/app/postcss.config.mjs
      - ./fe/next.config.ts:/app/next.config.ts
    networks:
      - default
      - vinylnet
    ports:
      - ${FE_PORT_EXT:-5201}:4000
    container_name: vinyl.fe
    command: npm run dev
    depends_on:
      be:
        condition: service_started

  studio:
    image: vinylstudio
    build:
      dockerfile: Dockerfile.be
    environment: *be-env
    secrets: [db_password]
    volumes:
      - ./be:/app/
      - /app/node_modules
    networks:
      - default
      - vinylnet
    ports:
      - ${STUDIO_PORT_EXT:-5203}:5555
    container_name: vinyl.studio
    command: npx prisma studio -p 5555 -b none
    depends_on:
      seed:
        condition: service_completed_successfully

networks:
  vinylnet:
    driver: bridge
    ipam:
      config:
        - subnet: 10.18.0.0/24
  default:
    driver: bridge
    external: false

volumes:
  vinyldb_vol:

secrets:
  db_password:
    file: ./dev-secrets/db_password
