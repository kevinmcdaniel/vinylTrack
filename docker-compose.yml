# Local dev stack. Config is literal here; secrets are Docker secret files (#65).
# Nothing reads .env through env_file any more: each service gets exactly the
# environment and secrets it needs. Ports can be overridden from an optional
# .env (see .env.example), which compose reads for ${...} interpolation only.

x-db-config: &db-config
  DB_HOST: vinyl.db
  DB_PORT_INT: "5432"
  DB_VINYLTRACK_NAME: vinyltrack
  DB_VINYLTRACK_USER: vinyltrack
  DB_PASSWORD_FILE: /run/secrets/db_password

x-be-env: &be-env
  <<: *db-config
  APP_ENV: development
  NODE_ENV: development

services:

  be:
    image: vinylbe
    build:
      dockerfile: Dockerfile.be
      target: dev
    environment:
      <<: *be-env
      PORT: "3000"
      PUBLIC_HOSTNAME: localhost
      INTERNAL_API_SECRET_FILE: /run/secrets/internal_api_secret
      TURNSTILE_SECRET_KEY_FILE: /run/secrets/turnstile_secret_key
      # Turnstile automation mode (#11), so the Bruno auth checks run locally too.
      AUTOMATION_KEY_FILE: /run/secrets/automation_key
      TURNSTILE_TEST_SECRET_KEY: 1x0000000000000000000000000000000AA
      # The mailer (#62); be is its only caller. Read by #74's magic-link route.
      MAILER_URL: http://mailer:3000
      MAILER_TOKEN_FILE: /run/secrets/mailer_token
    # The auth secrets go to be only; migrate/seed/studio need just the DB (#73).
    secrets: [db_password, internal_api_secret, turnstile_secret_key, automation_key, mailer_token]
    volumes:
      - ./be:/app/
      - /app/node_modules
    networks:
      - default
      - vinylnet
      - mailnet
    ports:
      - ${BE_PORT_EXT:-5202}:3000
    container_name: vinyl.be
    command: npm run dev
    depends_on:
      seed:
        condition: service_completed_successfully

  migrate:
    image: vinylbe
    build:
      dockerfile: Dockerfile.be
      target: dev
    environment: *be-env
    secrets: [db_password]
    volumes:
      - ./be:/app/
      - /app/node_modules
    networks:
      - default
      - vinylnet
    container_name: vinyl.migrate
    command: npx prisma migrate deploy
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  seed:
    image: vinylbe
    build:
      dockerfile: Dockerfile.be
      target: dev
    environment: *be-env
    secrets: [db_password]
    volumes:
      - ./be:/app/
      - /app/node_modules
    networks:
      - default
      - vinylnet
    container_name: vinyl.seed
    # seed.ts imports src/generated/client, which is gitignored and otherwise
    # only made by `be`'s `npm run dev` — and `be` starts after seed. Generate
    # here so a fresh clone comes up without a manual step.
    command: sh -c "npx prisma generate && npx prisma db seed"
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully

  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_DB: vinyltrack
      POSTGRES_USER: vinyltrack
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      PGPORT: "5432"
    secrets: [db_password]
    command: -p 5432
    ports:
      - "${DB_PORT_EXT:-5204}:5432"
    container_name: vinyl.db
    volumes:
      - vinyldb_vol:/var/lib/postgresql/data
    networks:
      - default
      - vinylnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vinyltrack -d vinyltrack -p 5432"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  fe:
    image: vinylfe
    build:
      dockerfile: Dockerfile.fe
      target: dev
    environment:
      APP_ENV: development
      NODE_ENV: development
      PORT: "4000"
      BE_URL: http://vinyl.be
      BE_PORT_INT: "3000"
      PUBLIC_HOSTNAME: localhost
      # The browser's origin. Without it Auth.js builds error redirects (an
      # expired magic link) from the container's own port 4000.
      AUTH_URL: http://localhost:${FE_PORT_EXT:-5201}
      # Cloudflare's always-pass test site key: dev holds no real credentials (#73).
      TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      AUTH_SECRET_FILE: /run/secrets/auth_secret
      INTERNAL_API_SECRET_FILE: /run/secrets/internal_api_secret
    # Never db_password. No Google in dev: the dev sign-in covers it.
    secrets: [auth_secret, internal_api_secret]
    volumes:
      - ./fe/public:/app/public
      - ./fe/src:/app/src
      - ./docs:/app/docs
      # Mount build configs so edits (e.g. tailwind `content`) are live without an image rebuild.
      - ./fe/tailwind.config.ts:/app/tailwind.config.ts
      - ./fe/postcss.config.mjs:/app/postcss.config.mjs
      - ./fe/next.config.ts:/app/next.config.ts
    networks:
      - default
      - vinylnet
    ports:
      - ${FE_PORT_EXT:-5201}:4000
    container_name: vinyl.fe
    command: npm run dev
    depends_on:
      be:
        condition: service_started

  # Internal mailer (#62). Log mode in dev: it prints sign-in links instead of
  # sending, so no Google credentials are needed. Only be can reach it.
  mailer:
    image: vinylmailer
    build:
      dockerfile: Dockerfile.mailer
      target: dev
    environment:
      APP_ENV: development
      PORT: "3000"
      PUBLIC_HOSTNAME: localhost
      MAILER_MODE: log
      MAILER_FROM: vinyltrack@example.org
      # Links point at the dev FE, which may be on an overridden port.
      FE_PORT_EXT: ${FE_PORT_EXT:-5201}
      MAILER_TOKEN_FILE: /run/secrets/mailer_token
    secrets: [mailer_token]
    volumes:
      - ./mailer/src:/app/src
      - ./mailer/scripts:/app/scripts
    networks: [mailnet]
    container_name: vinyl.mailer
    command: npm run dev

  studio:
    image: vinylstudio
    build:
      dockerfile: Dockerfile.be
      target: dev
    environment: *be-env
    secrets: [db_password]
    volumes:
      - ./be:/app/
      - /app/node_modules
    networks:
      - default
      - vinylnet
    ports:
      - ${STUDIO_PORT_EXT:-5203}:5555
    container_name: vinyl.studio
    command: npx prisma studio -p 5555 -b none
    depends_on:
      seed:
        condition: service_completed_successfully

networks:
  # be <-> mailer only, and no route out (#62).
  mailnet:
    internal: true
  vinylnet:
    driver: bridge
    ipam:
      config:
        - subnet: 10.18.0.0/24
  default:
    driver: bridge
    external: false

volumes:
  vinyldb_vol:

secrets:
  db_password:
    file: ./dev-secrets/db_password
  internal_api_secret:
    file: ./dev-secrets/internal_api_secret
  auth_secret:
    file: ./dev-secrets/auth_secret
  automation_key:
    file: ./dev-secrets/automation_key
  mailer_token:
    file: ./dev-secrets/mailer_token
  turnstile_secret_key:
    file: ./dev-secrets/turnstile_secret_key
