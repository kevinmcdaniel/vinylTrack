<!-- @dsCard group="Spacing" viewport="700x150" subtitle="4px base scale" name="Spacing Scale" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-body);background:var(--surface-app);padding:20px 22px;}
  .row{display:flex;align-items:flex-end;gap:14px;}
  .it{display:flex;flex-direction:column;gap:6px;align-items:center;}
  .bar{background:var(--accent);border-radius:3px;width:22px;}
  .lab{font-family:var(--font-mono);font-size:10px;color:var(--text-5);}
  .lab b{display:block;color:var(--text-2);font-weight:600;}
</style></head><body>
  <div class="row">
    <div class="it"><div class="bar" style="height:4px"></div><div class="lab"><b>1</b>4</div></div>
    <div class="it"><div class="bar" style="height:8px"></div><div class="lab"><b>2</b>8</div></div>
    <div class="it"><div class="bar" style="height:12px"></div><div class="lab"><b>3</b>12</div></div>
    <div class="it"><div class="bar" style="height:16px"></div><div class="lab"><b>4</b>16</div></div>
    <div class="it"><div class="bar" style="height:20px"></div><div class="lab"><b>5</b>20</div></div>
    <div class="it"><div class="bar" style="height:24px"></div><div class="lab"><b>6</b>24</div></div>
    <div class="it"><div class="bar" style="height:28px"></div><div class="lab"><b>7</b>28</div></div>
    <div class="it"><div class="bar" style="height:32px"></div><div class="lab"><b>8</b>32</div></div>
  </div>
</body></html>
