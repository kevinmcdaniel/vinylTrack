<!-- @dsCard group="Colors" viewport="700x186" subtitle="Live-calling floor view — high contrast, calm" name="Dark · Surfaces & Text" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;}
  .stage{font-family:var(--font-body);background:var(--surface-app);padding:18px 20px;}
  .grp{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;}
  .sw{display:flex;flex-direction:column;gap:5px;}
  .chip{width:96px;height:44px;border-radius:8px;border:1px solid var(--border-strong);}
  .lab{font-family:var(--font-mono);font-size:10px;color:var(--text-5);line-height:1.35;}
  .lab b{display:block;color:var(--text-2);font-weight:600;}
  .txt{display:flex;flex-direction:column;gap:3px;}
  .txt span{font-family:var(--font-mono);font-size:14px;}
</style></head><body>
  <div class="stage theme-dark">
    <div class="grp">
      <div class="sw"><div class="chip" style="background:var(--surface-app)"></div><div class="lab"><b>app</b>#1e2127</div></div>
      <div class="sw"><div class="chip" style="background:var(--surface-card)"></div><div class="lab"><b>card</b>#23272e</div></div>
      <div class="sw"><div class="chip" style="background:var(--surface-accent)"></div><div class="lab"><b>accent-soft</b>green .12</div></div>
      <div class="sw"><div class="chip" style="background:var(--get-out-bg);border-color:var(--get-out-border)"></div><div class="lab"><b>get-out</b>#2a2620</div></div>
    </div>
    <div class="txt">
      <span style="color:var(--text-1)">text-1 · #f2f3f5 — display</span>
      <span style="color:var(--text-3)">text-3 · #d7dadf — body</span>
      <span style="color:var(--text-5)">text-5 · #8f9da9 — mono labels</span>
      <span style="color:var(--text-6)">text-6 · #7b818b — ghost</span>
    </div>
  </div>
</body></html>
