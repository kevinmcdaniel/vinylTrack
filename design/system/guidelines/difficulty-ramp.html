<!-- @dsCard group="Colors" viewport="700x172" subtitle="Shared 1–5 ramp + pip meter — the product's core signal" name="Difficulty Ramp" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-body);background:var(--surface-app);padding:18px 20px;color:var(--text-2);}
  .ramp{display:flex;gap:8px;margin-bottom:18px;}
  .step{display:flex;flex-direction:column;gap:5px;align-items:flex-start;}
  .bar{width:120px;height:40px;border-radius:8px;}
  .lab{font-family:var(--font-mono);font-size:10px;color:var(--text-5);}
  .lab b{color:var(--text-2);font-weight:600;}
  .pipdemo{display:flex;align-items:center;gap:18px;}
  .pips{display:flex;gap:var(--pip-gap);align-items:flex-end;}
  .pip{width:var(--pip-w);height:var(--pip-h);border-radius:var(--pip-radius);}
  .cap{font-family:var(--font-mono);font-size:11px;color:var(--text-4);}
</style></head><body>
  <div class="ramp">
    <div class="step"><div class="bar" style="background:var(--diff-1)"></div><div class="lab"><b>1</b> easy</div></div>
    <div class="step"><div class="bar" style="background:var(--diff-2)"></div><div class="lab"><b>2</b></div></div>
    <div class="step"><div class="bar" style="background:var(--diff-3)"></div><div class="lab"><b>3</b> medium</div></div>
    <div class="step"><div class="bar" style="background:var(--diff-4)"></div><div class="lab"><b>4</b></div></div>
    <div class="step"><div class="bar" style="background:var(--diff-5)"></div><div class="lab"><b>5</b> hard</div></div>
  </div>
  <div class="pipdemo">
    <span class="cap">pip meter →</span>
    <span class="pips"><span class="pip" style="background:var(--diff-1)"></span><span class="pip" style="background:var(--pip-empty)"></span><span class="pip" style="background:var(--pip-empty)"></span><span class="pip" style="background:var(--pip-empty)"></span><span class="pip" style="background:var(--pip-empty)"></span></span>
    <span class="pips"><span class="pip" style="background:var(--diff-1)"></span><span class="pip" style="background:var(--diff-2)"></span><span class="pip" style="background:var(--diff-3)"></span><span class="pip" style="background:var(--pip-empty)"></span><span class="pip" style="background:var(--pip-empty)"></span></span>
    <span class="pips"><span class="pip" style="background:var(--diff-1)"></span><span class="pip" style="background:var(--diff-2)"></span><span class="pip" style="background:var(--diff-3)"></span><span class="pip" style="background:var(--diff-4)"></span><span class="pip" style="background:var(--diff-5)"></span></span>
    <span class="cap">difficulty 1 · 3 · 5</span>
  </div>
</body></html>
