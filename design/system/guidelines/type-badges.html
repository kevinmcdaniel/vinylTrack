<!-- @dsCard group="Colors" viewport="700x120" subtitle="Parser line classification — call & 5 text types" name="Type Badges" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-body);background:var(--surface-app);padding:20px;}
  .row{display:flex;flex-wrap:wrap;gap:10px;}
  .b{font-family:var(--font-mono);font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;border-radius:var(--r-tag);padding:5px 10px;}
</style></head><body>
  <div class="row">
    <span class="b" style="color:var(--badge-call-fg);background:var(--badge-call-bg)">call</span>
    <span class="b" style="color:var(--badge-activator-fg);background:var(--badge-activator-bg)">activator</span>
    <span class="b" style="color:var(--badge-filler-fg);background:var(--badge-filler-bg)">filler</span>
    <span class="b" style="color:var(--badge-tip-fg);background:var(--badge-tip-bg)">tip</span>
    <span class="b" style="color:var(--badge-warning-fg);background:var(--badge-warning-bg)">warning</span>
    <span class="b" style="color:var(--badge-recovery-fg);background:var(--badge-recovery-bg)">recovery</span>
  </div>
</body></html>
