<!-- @dsCard group="Colors" viewport="700x150" subtitle="Pastel accent + low-glare status" name="Dark · Accent & Status" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;}
  .stage{font-family:var(--font-body);background:var(--surface-app);padding:18px 20px;}
  .grp{display:flex;flex-wrap:wrap;gap:10px;}
  .sw{display:flex;flex-direction:column;gap:5px;}
  .chip{width:108px;height:44px;border-radius:8px;border:1px solid var(--border-strong);}
  .lab{font-family:var(--font-mono);font-size:10px;color:var(--text-5);line-height:1.35;}
  .lab b{display:block;color:var(--text-2);font-weight:600;}
</style></head><body>
  <div class="stage theme-dark">
    <div class="grp">
      <div class="sw"><div class="chip" style="background:var(--accent)"></div><div class="lab"><b>accent</b>#9fd6b0</div></div>
      <div class="sw"><div class="chip" style="background:var(--info)"></div><div class="lab"><b>info</b>#9fd6b0</div></div>
      <div class="sw"><div class="chip" style="background:var(--warn)"></div><div class="lab"><b>warn / gold</b>#e3c389</div></div>
      <div class="sw"><div class="chip" style="background:var(--danger)"></div><div class="lab"><b>danger</b>#e8a89f</div></div>
      <div class="sw"><div class="chip" style="background:var(--hand-link)"></div><div class="lab"><b>hand-link</b>#e7d6a8</div></div>
    </div>
  </div>
</body></html>
