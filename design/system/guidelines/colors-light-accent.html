<!-- @dsCard group="Colors" viewport="700x150" subtitle="Primary accent + semantic status" name="Light · Accent & Status" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-body);background:var(--surface-app);padding:18px 20px;}
  .grp{display:flex;flex-wrap:wrap;gap:10px;}
  .sw{display:flex;flex-direction:column;gap:5px;}
  .chip{width:96px;height:44px;border-radius:8px;border:1px solid var(--border);}
  .lab{font-family:var(--font-mono);font-size:10px;color:var(--text-5);line-height:1.35;}
  .lab b{display:block;color:var(--text-2);font-weight:600;}
</style></head><body>
  <div class="grp">
    <div class="sw"><div class="chip" style="background:var(--accent)"></div><div class="lab"><b>accent</b>#2f6fed</div></div>
    <div class="sw"><div class="chip" style="background:var(--success)"></div><div class="lab"><b>success</b>#2f9e63</div></div>
    <div class="sw"><div class="chip" style="background:var(--warn-strong)"></div><div class="lab"><b>warn</b>#e0a64e</div></div>
    <div class="sw"><div class="chip" style="background:var(--danger-line)"></div><div class="lab"><b>danger</b>#e0483f</div></div>
    <div class="sw"><div class="chip" style="background:var(--designator)"></div><div class="lab"><b>designator</b>#b8732a</div></div>
    <div class="sw"><div class="chip" style="background:var(--get-out-accent)"></div><div class="lab"><b>get-out</b>#7fe0a6</div></div>
  </div>
</body></html>
