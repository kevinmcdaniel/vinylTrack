<!-- @dsCard group="Type" viewport="700x150" subtitle="IBM Plex Mono — eyebrow labels, counts, formation codes" name="Mono · IBM Plex Mono" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-mono);background:var(--surface-app);padding:20px 22px;}
  .eyebrow{font-size:var(--fs-label);letter-spacing:var(--label-spacing-wide);text-transform:uppercase;color:var(--text-5);}
  .row{display:flex;gap:10px;align-items:center;margin-top:12px;}
  .code{font-size:11px;color:var(--text-2);background:var(--surface-accent);border-radius:var(--r-tag);padding:3px 8px;}
  .count{font-size:11px;color:var(--text-4);background:var(--surface-sunken);border:1px solid var(--border);border-radius:var(--r-tag);padding:3px 8px;}
  .meta{font-size:10px;color:var(--text-5);margin-top:14px;letter-spacing:.5px;}
</style></head><body>
  <div class="eyebrow">Current formation</div>
  <div class="row">
    <span class="code">Ocean Waves</span>
    <span style="color:var(--text-6)">→</span>
    <span class="code">Two-Faced Lines</span>
    <span class="count">×3</span>
    <span class="count">8 beats</span>
  </div>
  <div class="meta">UPPERCASE + 1.5–2px tracking for eyebrows · sentence case for codes</div>
</body></html>
