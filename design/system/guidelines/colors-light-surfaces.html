<!-- @dsCard group="Colors" viewport="700x186" subtitle="Editing & reference surfaces, text ramp" name="Light · Surfaces & Text" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-body);background:var(--surface-app);padding:18px 20px;color:var(--text-2);}
  .grp{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;}
  .sw{display:flex;flex-direction:column;gap:5px;}
  .chip{width:96px;height:44px;border-radius:8px;border:1px solid var(--border);}
  .lab{font-family:var(--font-mono);font-size:10px;color:var(--text-5);line-height:1.35;}
  .lab b{display:block;color:var(--text-2);font-weight:600;}
  .txt{display:flex;flex-direction:column;gap:3px;}
  .txt span{font-family:var(--font-mono);font-size:14px;}
</style></head><body>
  <div class="grp">
    <div class="sw"><div class="chip" style="background:var(--surface-app)"></div><div class="lab"><b>app</b>#eef1f4</div></div>
    <div class="sw"><div class="chip" style="background:var(--surface-card);box-shadow:var(--shadow-card)"></div><div class="lab"><b>card</b>#ffffff</div></div>
    <div class="sw"><div class="chip" style="background:var(--surface-sunken)"></div><div class="lab"><b>sunken</b>#f4f7fb</div></div>
    <div class="sw"><div class="chip" style="background:var(--surface-accent)"></div><div class="lab"><b>accent-soft</b>#e7eefc</div></div>
    <div class="sw"><div class="chip" style="background:var(--surface-inverse)"></div><div class="lab"><b>inverse</b>#10233f</div></div>
  </div>
  <div class="txt">
    <span style="color:var(--text-1)">text-1 · #142031 — display</span>
    <span style="color:var(--text-3)">text-3 · #3a4856 — body</span>
    <span style="color:var(--text-5)">text-5 · #8a98a8 — mono labels</span>
    <span style="color:var(--text-6)">text-6 · #aebccb — ghost / placeholder</span>
  </div>
</body></html>
