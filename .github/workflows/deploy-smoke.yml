name: Deploy path smoke test

# Throwaway check for #60, task 2: can a GitHub-hosted runner reach the home
# server through Cloudflare Access with the service token (no browser login;
# cloudflared#1673) and get an answer from deploy-shell? Delete once the real
# release workflow has deployed successfully.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Install cloudflared
        run: |
          curl -fsSL -o cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          cloudflared --version

      - name: Write key and pinned host key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts

      - name: ssh _vinyldeploy status
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set +e
          out=$(timeout 60 ssh \
            -o ProxyCommand="cloudflared access ssh --hostname %h --service-token-id $CF_ACCESS_CLIENT_ID --service-token-secret $CF_ACCESS_CLIENT_SECRET" \
            -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes -o BatchMode=yes -i ~/.ssh/deploy_key \
            "_vinyldeploy@$DEPLOY_HOST" status 2>&1)
          code=$?
          echo "$out"
          echo "exit: $code"
          # Reached deploy.sh: it either reports a version or says nothing is deployed yet.
          if echo "$out" | grep -qE '^deploy: (current version|nothing deployed yet)'; then
            echo "::notice::Deploy path works: runner → Access → sshd → deploy-shell → deploy.sh"
            exit 0
          fi
          echo "::error::Did not reach deploy.sh (exit $code). A browser-login URL above means the service token was ignored (cloudflared#1673)."
          exit 1
