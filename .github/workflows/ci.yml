name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  be:
    name: BE typecheck + lint + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: be
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vinyltrack
          POSTGRES_PASSWORD: citestpw
          POSTGRES_DB: vinyltrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vinyltrack -d vinyltrack"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DB_VINYLTRACK_URL: postgresql://vinyltrack:citestpw@localhost:5432/vinyltrack
      AUTH_BOOTSTRAP_OWNER_EMAIL: kevin@example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: be/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npx prisma migrate deploy
      - run: npm run test

  fe:
    name: FE typecheck + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fe/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
