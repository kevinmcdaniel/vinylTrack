name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  be:
    name: BE typecheck + lint + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: be
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vinyltrack
          POSTGRES_PASSWORD: citestpw
          POSTGRES_DB: vinyltrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vinyltrack -d vinyltrack"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Config parts + the plain DB_PASSWORD form, which be/src/config.ts allows
      # outside production (#65). CI has no secret files to mount.
      APP_ENV: test
      DB_HOST: localhost
      DB_PORT_INT: "5432"
      DB_VINYLTRACK_NAME: vinyltrack
      DB_VINYLTRACK_USER: vinyltrack
      DB_PASSWORD: citestpw
      AUTH_BOOTSTRAP_OWNER_EMAIL: kevin@example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: be/package-lock.json
      # npm 11.6.1 writes lockfiles every other npm rejects (#44), and the npm
      # bundled with Node drifts across patch releases — so pin it explicitly
      # rather than inheriting whatever Node 24 happens to ship.
      - run: npm i -g npm@11.19.0
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npx prisma migrate deploy
      - run: npm run test

  api:
    name: BE API collection (Bruno)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: be
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vinyltrack
          POSTGRES_PASSWORD: citestpw
          POSTGRES_DB: vinyltrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vinyltrack -d vinyltrack"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Config parts + the plain DB_PASSWORD form, which be/src/config.ts allows
      # outside production (#65). CI has no secret files to mount.
      APP_ENV: test
      DB_HOST: localhost
      DB_PORT_INT: "5432"
      DB_VINYLTRACK_NAME: vinyltrack
      DB_VINYLTRACK_USER: vinyltrack
      DB_PASSWORD: citestpw
      AUTH_BOOTSTRAP_OWNER_EMAIL: kevin@example.com
      # bruno/environments/local.bru points baseUrl at localhost:5202 and
      # src/server.ts reads PORT, so binding here lets CI run the collection
      # through the same `npm run test:api` and the same environment file a
      # developer uses locally — no --env-var baseUrl override to drift.
      PORT: "5202"
      BRUNO_JUNIT: ${{ github.workspace }}/bruno-junit.xml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: be/package-lock.json
      # npm 11.6.1 writes lockfiles every other npm rejects (#44), and the npm
      # bundled with Node drifts across patch releases — so pin it explicitly
      # rather than inheriting whatever Node 24 happens to ship.
      - run: npm i -g npm@11.19.0
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      # The collection drives the x-user-email dev identities (#26) and asserts
      # on seeded rows, so it needs the seed, not just the schema.
      - run: npx prisma db seed

      - name: Start API and wait for /api/health
        run: |
          # tsx directly, not `npm run dev` — that is nodemon with file watching,
          # which has no business in CI.
          npx tsx src/server.ts > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 60); do
            # Quiet: a refused connection is the expected case while booting.
            if curl -fs "http://localhost:$PORT/api/health" > /dev/null 2>&1; then
              echo "API answered /api/health on port $PORT after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::API never answered http://localhost:$PORT/api/health"
          cat "$RUNNER_TEMP/api.log"
          exit 1

      - name: Run Bruno collection
        # `test:api` already carries --bail, so the run stops at the first
        # failing request instead of cascading; the report still lists every
        # request, with the unrun ones marked skipped.
        run: npm run test:api -- --reporter-junit "$BRUNO_JUNIT"

      - name: Summarize collection results
        if: always()
        run: python3 ../.github/scripts/bruno-summary.py "$BRUNO_JUNIT" >> "$GITHUB_STEP_SUMMARY"

      - name: API log
        if: failure()
        run: cat "$RUNNER_TEMP/api.log"

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bruno-junit
          path: bruno-junit.xml
          if-no-files-found: warn

  fe:
    name: FE typecheck + lint + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: fe/package-lock.json
      # npm 11.6.1 writes lockfiles every other npm rejects (#44), and the npm
      # bundled with Node drifts across patch releases — so pin it explicitly
      # rather than inheriting whatever Node 24 happens to ship.
      - run: npm i -g npm@11.19.0
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test

  host:
    name: Host scripts (bats)
    # macOS, because the home server runs these under macOS's /bin/bash 3.2.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: npx --yes bats@1.11.1 host/tests

  images:
    name: Production images build
    # Native arm64, like the home server and the release build (#60). Build
    # only: nothing is pushed from CI.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.be --target prod --build-arg VINYLTRACK_VERSION=ci -t vinyltrack-be:ci .
      - run: docker build -f Dockerfile.be --target migrate --build-arg VINYLTRACK_VERSION=ci -t vinyltrack-migrate:ci .
      - run: docker build -f Dockerfile.fe --target prod --build-arg VINYLTRACK_VERSION=ci -t vinyltrack-fe:ci .
