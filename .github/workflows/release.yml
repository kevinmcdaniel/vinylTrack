name: Release

# A release tag is the release (#60). Pushing vX.Y.Z or vX.Y.Z-rc.N:
#   1. re-runs CI against the tagged commit; a red commit never ships
#   2. builds and pushes arm64 images to GHCR, tagged with the release tag
#   3. creates the GitHub Release, with compose.prod.yml attached
#      (deploy.sh fetches it from there, so compose always matches the images)
#   4. deploys, after approval on the `production` environment
# Release and deploy are separate jobs, so a release can sit approved-pending
# until a good time to deploy.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  tag:
    name: Check tag
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::'$TAG' is not a release tag (vX.Y.Z or vX.Y.Z-rc.N)."
            exit 1
          fi
          [[ "$TAG" == *-rc.* ]] && echo "prerelease=true" >> "$GITHUB_OUTPUT" || echo "prerelease=false" >> "$GITHUB_OUTPUT"

  ci:
    name: CI
    needs: tag
    uses: ./.github/workflows/ci.yml

  images:
    name: Build and push images
    needs: [tag, ci]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { name: vinyltrack-be, dockerfile: Dockerfile.be, target: prod }
          - { name: vinyltrack-migrate, dockerfile: Dockerfile.be, target: migrate }
          - { name: vinyltrack-fe, dockerfile: Dockerfile.fe, target: prod }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: tags
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.tag.outputs.prerelease }}
        run: |
          tags="$IMAGE:$TAG"
          # `latest` only ever means the newest final release.
          [[ "$PRERELEASE" == false ]] && tags="$tags,$IMAGE:latest"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: VINYLTRACK_VERSION=${{ github.ref_name }}
          # Links the package to this repo in GHCR.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  release:
    name: GitHub Release
    needs: [tag, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.tag.outputs.prerelease }}
        run: |
          flags=(--generate-notes --verify-tag)
          [[ "$PRERELEASE" == true ]] && flags+=(--prerelease) || flags+=(--latest)
          gh release create "$TAG" compose.prod.yml "${flags[@]}"

  deploy:
    name: Deploy
    needs: release
    uses: ./.github/workflows/deploy.yml
    with:
      action: deploy
    secrets: inherit
